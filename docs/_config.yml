title: CubeForge
description: >-
  A rigorously specified, pure-Python Rubik's Cube engine - an
  immutable core model with zero dependencies, a full compliance test
  suite, and a REST + 3D web app built on top of it.
baseurl: "/CubeForge"
url: "https://amalraj-joseph.github.io"
github_repo: "https://github.com/Amalraj-Joseph/CubeForge"

markdown: kramdown

header_pages:
  - getting-started.md
  - architecture.md
  - api-reference.md
  - specification.md
  - web-app.md

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
