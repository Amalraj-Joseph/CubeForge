[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cube"
version = "0.1.0"
description = "Language-agnostic Rubik's Cube implementation"
requires-python = ">=3.11"

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]